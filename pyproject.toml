[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.0", "setuptools-scm" ]

[project]
name = "mailgun"
description = "Python SDK for Mailgun"
readme = "README.md"
keywords = [
  "email python-wrapper",
  "mailgun",
  "Mailgun API Python Wrapper",
  "mailgun-api",
  "Python SDK for Mailgun",
  "transactional-emails",
  "wrapper",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Serhii Kupriienko", email = "kupriienko.serhii@gmail.com" },
]
authors = [
  { name = "diskovod", email = "diskovodik@gmail.com" },
  { name = "Mailgun", email = "api@mailgun.com" },
]
requires-python = ">=3.11"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Communications :: Email",
  "Topic :: Utilities",
]

dynamic = [ "version" ]
dependencies = [
    "httpx2 >=2.7.0",     # The new primary async engine
    "httpx >=0.24.0",     # Kept as a fallback/safety net
    "requests>=2.33.0",
]

optional-dependencies.pydantic = [
  "pydantic >=2.13.4",
]

optional-dependencies.fastapi = [
  "fastapi>=0.100.0", "pydantic>=2.0.0"
]

optional-dependencies.build = [
    "python-build",
    "twine",
    "conda-build",
]
optional-dependencies.docs = [
  "docconvert",
  "pyment>=0.3.3", # for generating docstrings
]
optional-dependencies.linting = [
  "bandit",
  "pre-commit",
  "ruff",
  "mypy",
  "pyright",
  "types-requests>=2.33.0",
  "vulture",
  "python-dotenv>=1.2.2",
]
optional-dependencies.metrics = [
  "pystra",    # provides functionalities to enable structural reliability analysis
  "wily>=1.2", # a tool for reporting code complexity metrics
]
optional-dependencies.other = [ "toml" ]
optional-dependencies.profilers = [ "scalene>=1.3.16", "snakeviz" ]
optional-dependencies.spelling = [ "typos" ]
optional-dependencies.tests = [
  "codecov>=2.0.16",
  "coverage>=4.5.4",
    "hypothesis",
  # For a Private key PEM file generated in PKCS1 format.
  "openssl",
  # tests
  "pytest>=9.0.3",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov>=5.0.0",
  "pytest-order",
  "pytest-xdist",
  "pyfakefs",
  "responses",
]
# llvm is required
optional-dependencies.fuzzing = ["atheris"]

urls."Documentation" = "https://documentation.mailgun.com"
urls."Homepage" = "https://www.mailgun.com"
urls."Issue Tracker" = "https://github.com/mailgun/mailgun-python/issues"
urls."Repository" = "https://github.com/mailgun/mailgun-python"

[tool.setuptools]
py-modules = [ "mailgun._version" ]

[tool.setuptools.packages.find]
include = [ "mailgun", "mailgun.handlers", "mailgun.*" ]
exclude = [ "tests", "tests.*" ]

[tool.setuptools.package-data]
mailgun = [ "py.typed", "*.pyi" ]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"   # Don't try to guess next version
local_scheme = "no-local-version"
# Ignore uncommitted changes
git_describe_command = "git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*'"
write_to = "mailgun/_version.py"
write_to_template = '__version__ = "{version}"'
#fallback_version = "X.Y.ZrcN.postN.devN"  # Explicit fallback

[tool.ruff]
# Assume Python 3.11+
target-version = "py311"
line-length = 100

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
extend-exclude = [ "test", "tests" ]

# Enumerate all fixed violations.
show-fixes = true

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-line-length = "dynamic"
exclude = [ "*.pyi" ]
docstring-code-format = true

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    # --- Formatter Conflicts ---
    "COM812", # Missing trailing comma (Conflicts with ruff-format)
    "ISC001", # Implicit string concatenation (Conflicts with ruff-format)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "RUF105", # changes one-line imports to multi-lines

    # --- SDK Realities ---
    "ANN401", # Dynamically typed expressions. (An HTTP SDK REQUIRES `Any` for JSON data, files, and kwargs)
    "TRY003", # Avoid specifying long messages outside exception classes (Causes massive file bloat)
    "EM101",  # Exception must not use a string literal (Causes massive file bloat)
    "E501",   # Line too long (Let the formatter handle wrapping)

    # --- Docstring ---
    "D417", "D100", "D104",

    # --- Keep existing TODO ignores ---
    "C901",
    "PLR0913",
    "CPY001",
    "PLW0717", # too-many-statements-in-try-clause (PLW0717)
]
exclude = [ "mailgun/examples/*", "tests" ]
fixable = [ "ALL" ]
unfixable = [ "B" ]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
external = [ "DOC", "PLR" ]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "E402" ]
"mailgun/endpoints.py" = ["PLC0415"]

[tool.ruff.lint.pylint]
max-args = 9           # Default is 5. SDK endpoints need more (auth, data, headers, files, etc.)
max-returns = 9        # Default is 6.
max-branches = 15      # Default is 12.


[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.coverage.run]
source_pkgs = [ "mailgun" ]
branch = true
parallel = true
omit = [
  "mailgun/examples/*",
]

[tool.coverage.paths]
tests = [ "tests" ]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
# Adapted from this StackOverflow post:
# https://stackoverflow.com/questions/55944201/python-type-hinting-how-do-i-enforce-that-project-wide
python_version = "3.12"
mypy_path = "type_stubs"
namespace_packages = true
# This flag enhances the user feedback for error messages
pretty = true
# 3rd party import
ignore_missing_imports = true
# flag to suppress Name <var> already defined on a line
allow_redefinition = false
# Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = true
# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# None and optional handling
no_implicit_optional = true
# Configuring warnings
warn_return_any = false
warn_no_return = true
warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
# Misc
follow_imports = "silent"
strict_optional = false
strict_equality = true
#exclude = '''(?x)(
#    (^|/)test[^/]*\.py$    # files named "test*.py"
#  )'''
exclude = [
  "mailgun/examples/*",
]

# Configuring error messages
show_error_context = false
show_column_numbers = false
show_error_codes = true
disable_error_code = 'misc'

[tool.pyright]
include = [ "mailgun" ]
exclude = [ "mailgun/examples/*", "**/__pycache__" ]
reportAttributeAccessIssue = false
reportMissingImports = false

[tool.typos.default.extend-words]
requestor = "requestor"

[tool.bandit]
# usage: bandit -c pyproject.toml -r .
targets = ["mailgun"]
exclude_dirs = [ "tests", "tests.py" ]
tests = [ "B201", "B301" ]
skips = [ "B101", "B601" ]
severity = "low"

[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = [
  "os.execl",
  "os.execle",
  "os.execlp",
  "os.execlpe",
  "os.execv",
  "os.execve",
  "os.execvp",
  "os.execvpe",
  "os.spawnl",
  "os.spawnle",
  "os.spawnlp",
  "os.spawnlpe",
  "os.spawnv",
  "os.spawnve",
  "os.spawnvp",
  "os.spawnvpe",
  "os.startfile",
]
shell = [
  "os.system",
  "os.popen",
  "os.popen2",
  "os.popen3",
  "os.popen4",
  "popen2.popen2",
  "popen2.popen3",
  "popen2.popen4",
  "popen2.Popen3",
  "popen2.Popen4",
  "commands.getoutput",
  "commands.getstatusoutput",
]
subprocess = [
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output",
]

[tool.slotscheck]
strict-imports = false
require-subclass = false
exclude-modules = '''
(
    ^mailgun\.examples\..*
)
'''
